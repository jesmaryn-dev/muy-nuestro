name: Publicar renovacion aprobada noviembre 2026
on:
  push:
    paths:
      - .github/workflows/renovacion-aprobada-2026-11.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
